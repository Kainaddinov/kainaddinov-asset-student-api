services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kainaddinov-asset-student-api:v1.0-kainaddinov-asset
    container_name: kainaddinov-asset-student-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kainaddinov-asset-network

  db:
    image: postgres:16
    container_name: kainaddinov-asset-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - kainaddinov-asset-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kainaddinov-asset-network

volumes:
  kainaddinov-asset-postgres-data:

networks:
  kainaddinov-asset-network:
    driver: bridge
